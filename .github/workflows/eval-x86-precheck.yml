# T2 计划 Task 11 Step 4b：在 x86 上预检冷烟集里的实例（默认镜像最小的 astropy__astropy-12907，作者 2026-11-26）。
# 只能手动触发；不用任何密钥，不读 .env。x86 镜像按 digest 锁定，取自 eval/tasksets/smoke-v1.json 的 images。
# 入选标准同 Mac：金标准 → resolved、空补丁时 FAIL_TO_PASS 每一条都失败、挂载运行包后 node --version 成功、
# 冷烟集金标准评分墙钟 ≤ 600 秒、容器启动时工作区干净；infra_error 重试 2 次后记为无法测量。
name: eval-x86-precheck

on:
  workflow_dispatch:
    inputs:
      instance_id:
        description: smoke-v1 里的实例 id
        default: astropy__astropy-12907
        required: true

permissions:
  contents: read

jobs:
  precheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      INSTANCE: ${{ inputs.instance_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install
        run: |
          pnpm install --frozen-lockfile
          python -m venv eval/.venv
          eval/.venv/bin/pip install -r eval/requirements.txt

      - name: Build linux-x64 bundle
        run: bash scripts/build-eval-bundle.sh linux-x64

      - name: Pull image by digest
        run: |
          IMAGE=$(jq -er --arg id "$INSTANCE" '.images[$id]["linux-x64"]' eval/tasksets/smoke-v1.json)
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          docker pull "$IMAGE"

      - name: Precheck
        working-directory: eval
        run: |
          .venv/bin/python - <<'EOF'
          import json, os, platform, sys
          from dataclasses import asdict
          from pathlib import Path
          from datasets import load_dataset
          from forgepilot_eval.taskset import DATASET, REVISION, SMOKE_GOLD_MAX_S, precheck

          print("python", platform.python_version(), platform.machine())
          ds = load_dataset(DATASET, split="test", revision=REVISION)
          row = dict(next(r for r in ds if r["instance_id"] == os.environ["INSTANCE"]))
          r = precheck({**row, "image": os.environ["IMAGE"]}, Path(".cache/bundle-linux-x64"), SMOKE_GOLD_MAX_S)
          print(json.dumps(asdict(r), indent=2))
          for f in sorted(Path("runs").glob("precheck-*/*/attempt-*/precheck.json")):
              print(f, f.read_text())
          sys.exit(0 if r.ok else 1)
          EOF

      - name: Leftover containers and networks
        if: always()
        run: |
          docker ps -a --filter label=fp-run
          docker network ls --filter label=fp-run

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: precheck-logs
          path: eval/runs/
