# Kimi K2.6 评测配置（T2 计划 Task 14b；D7、D8、D10）。经百炼北京端点（ADR 017），key 只给模型代理容器。
model:
  provider: qwen-api  # 同 T2-0 第 19 项探测：百炼 OpenAI 兼容端点用的 provider 名，不是指 Qwen 模型
  id: kimi-k2.6
  route: kimi
  base: https://dashscope.aliyuncs.com/compatible-mode/v1
  keyEnv: DASHSCOPE_API_KEY
  # 以下写进容器里 runner 读的 models.json（pi 1.5.1 格式），照抄 T2-0 第 19 项百炼 kimi-k2.6 探测（实现说明 0.6、附录 A）
  compat: {thinkingFormat: qwen, supportsDeveloperRole: false, supportsStore: false, supportsReasoningEffort: false, thinkingTokenBudgetField: thinking_budget}
  pi: {reasoning: true, input: [text], contextWindow: 262144, maxTokens: 8192}

thinking: low

# 由模型代理写进每个请求（pi 1.5.1 不发 top_p，计划 Task 7）。
# 出处：Hugging Face 模型卡 https://huggingface.co/moonshotai/Kimi-K2.6 ，「Evaluation Results」脚注 1（General Testing Details）：
# "Unless otherwise specified, all Kimi K2.6 experiments were conducted with temperature = 1.0, top-p = 1.0"（思考模式）；
# 脚注 4（Coding Tasks）的 SWE-Bench 部分没有另给采样值，所以取这组评测值，优先于「Model Usage」的推荐值（思考 1.0、top_p 0.95）。
sampling:
  temperature: 1.0
  top_p: 1.0

tools: [read, bash, edit, write, grep, find, ls]

# D8 临时危险命令清单：只写命令本身，命令位置的锚定由 Policy 负责；T3 起由策略服务替换
danger_patterns:
  - 'rm\s+(?:-[\w-]+\s+)+(["'']?)/\*?\1'  # / 两侧可带成对引号
  - 'git\s+push'
  - 'curl'
  - 'wget'
  - 'nc'
  - 'ssh'
  - 'scp'
  - 'shutdown'
  - 'reboot'
  - 'mkfs(?:\.\w+)?'
  - 'dd'
  - ':\(\)\s*\{\s*:\s*\|\s*:\s*&\s*\}\s*;\s*:'  # fork 炸弹

max_tool_calls: 100
task_timeout_s: 1800
grade_timeout_s: 1800

prompt_file: ../prompts/swe-v1.txt  # 相对本文件

# 元/百万 token，百炼北京；缓存价未列，按输入价计（实现说明 0.6）
price: {input_per_m: 6.5, output_per_m: 27}
assumed_tokens_per_run:  # Kimi 冒烟后按实测 ×2 重新校准
  input: 400000
  output: 13000
  source: 暂用 Qwen 的 smoke-2026-11-26 实测 ×2 值（qwen3.6.yaml），待 Kimi 冒烟校准

# D10 计分口径，开跑前固定
scoring:
  failures: [patch_apply_failed, empty_patch, run_failed, timeout, tool_budget]
  retry_then_exclude: [infra_error, rate_limited]
  max_retries: 2
  max_excluded_fraction: 0.05
